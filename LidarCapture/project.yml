name: LidarCapture
options:
  bundleIdPrefix: com.mercurycontracting
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  LidarCapture:
    type: application
    platform: iOS
    sources:
      - path: LidarCapture
    info:
      path: LidarCapture/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mercurycontracting.LidarCapture
        PRODUCT_NAME: LidarCapture
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: LidarCapture/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: QuickLook.framework
      - sdk: ModelIO.framework
