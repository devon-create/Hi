<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0C3B1C">
    <title>Scan · LiDAR Capture</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div class="shell">
        <header class="brand-bar">
            <div class="brand">
                <div class="brand-mark">L</div>
                <div>
                    <div class="brand-name">LiDAR Capture</div>
                    <div class="brand-tag">Mercury Contracting · 3D space library</div>
                </div>
            </div>
            <a class="back" href="./">← All scans</a>
        </header>

        <div class="scan-header">
            <h1 id="title">Scan</h1>
            <div id="ar-link"></div>
        </div>

        <div id="error" class="error" hidden></div>

        <div class="scan-shell">
            <div class="viewer" id="viewer">
                <div class="viewer-overlay">
                    <button class="btn btn-ghost" id="reset-camera" type="button">Reset view</button>
                </div>
            </div>

            <aside class="panel" id="side">
                <h2>Walkthrough video</h2>
                <video id="video" controls playsinline preload="metadata"></video>

                <h2 style="margin-top:18px">Stats</h2>
                <dl class="stats" id="stats"></dl>
            </aside>
        </div>

        <footer>
            © Mercury Contracting · accent <span style="color:#6fd089">#0C3B1C</span>
        </footer>
    </div>

    <script type="module" src="./scan.js"></script>
</body>
</html>
